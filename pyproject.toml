[project]
name = "feekg"
version = "2.1.0"
description = "Financial Event Evolution Knowledge Graph (FE-EKG) and RAG-based financial risk intelligence"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["api", "shared/config", "feekg_core/query", "feekg_core/evolution", "radar"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["demos", "*.ipynb"]

[tool.ruff.lint]
# Repository-wide: only errors that indicate broken code (syntax, undefined names).
select = ["E9", "F63", "F7", "F82"]
